spring.application.name=collabdesk
server.port=8080

# ---- Default profile: in-memory H2 (no setup needed) ----
spring.datasource.url=jdbc:h2:mem:collabdesk;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Swagger UI -> http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/**

# Daily overdue check at 01:00
collabdesk.overdue.cron=0 0 1 * * *
collabdesk.approval.undo-minutes=5

# Always render dates/numbers in English (otherwise the JVM's system locale, e.g. Chinese, is used: "01 11月")
spring.web.locale=en_SG
spring.web.locale-resolver=fixed
