<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body>
<div class="auth-card">
    <div class="card">
        <h1>Collab<span style="color:var(--accent)">Desk</span></h1>
        <p class="muted" style="margin:0 0 20px">Creator × brand collaborations, from proposal to payment.</p>

        <div class="flash err" th:if="${param.error}">Wrong username or password, or the account is disabled.</div>
        <div class="flash ok" th:if="${param.logout}">You have been signed out.</div>
        <div class="flash ok" th:if="${success}" th:text="${success}">Account created</div>

        <form th:action="@{/login}" method="post">
            <label for="username">Username</label>
            <input id="username" name="username" autofocus required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required>
            <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center;margin-top:20px">Sign in</button>
        </form>
        <p class="small muted" style="margin-top:18px">New here? <a th:href="@{/register}">Create an account</a></p>
    </div>
    <p class="small muted" style="text-align:center">Demo: creator_ken · brand_bubbletea · admin</p>
</div>
</body>
</html>
