# Activate with the env var SPRING_PROFILES_ACTIVE=mysql (or -Dspring.profiles.active=mysql)
# allowPublicKeyRetrieval/useSSL: needed for MySQL 8's default auth on a local, non-SSL connection (dev only)
spring.datasource.url=jdbc:mysql://localhost:3306/collabdesk?createDatabaseIfNotExist=true&serverTimezone=Asia/Singapore&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
# The password is read from the MYSQL_PASSWORD environment variable so it is never committed to Git.
# IntelliJ: Run config -> Environment variables -> MYSQL_PASSWORD=yourpassword
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
